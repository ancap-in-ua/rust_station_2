[workspace]
resolver = "2"
members = ["ps2-rt", "tools/hello", "tools/solid-color", "tools/alloc-hello", "tools/color-cycle", "tools/fb-fill"]

# Required because the target spec hard-codes "panic-strategy": "abort" and
# core is built without unwinding support for this target.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
